name: Agent on label

# When a maintainer adds the label "agent" to an issue, a background minicode task
# tries to turn the issue into a DRAFT pull request (Chapter 15). Only people with
# triage rights can add labels, so strangers cannot start the agent.
# Needs: secret LLM_API_KEY, variable LLM_MODEL (and LLM_BASE_URL if not OpenAI).
# Note: pull requests opened with GITHUB_TOKEN do not trigger other workflows;
# re-run CI from the PR page or use a GitHub App token.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Skip without an API key
        if: env.LLM_API_KEY == ''
        run: echo "No LLM_API_KEY secret configured - skipping."
      - uses: actions/checkout@v4
        if: env.LLM_API_KEY != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: env.LLM_API_KEY != ''
        with:
          python-version: "3.12"
      - name: Install minicode and build the sandbox image
        if: env.LLM_API_KEY != ''
        run: |
          git clone --depth 1 https://github.com/mdt01/minicode.git "$RUNNER_TEMP/minicode"
          pip install -r "$RUNNER_TEMP/minicode/requirements.txt"
          docker build -t campushub-sandbox -f labs/ch14/Dockerfile.sandbox .
      - name: Run the task (no network inside the sandbox)
        if: env.LLM_API_KEY != ''
        run: |
          git config user.name "minicode-agent"
          git config user.email "minicode-agent@users.noreply.github.com"
          export PYTHONPATH="$RUNNER_TEMP/minicode"
          python -m minicode.background add --issue "$ISSUE" --budget 400000
          python -m minicode.background run --once --open-pr \
            --mode auto --sandbox docker --sandbox-image campushub-sandbox \
            --verify "python -m pytest -q"
          python -m minicode.background list | tee summary.txt
      - name: Report back on the issue
        if: always() && env.LLM_API_KEY != ''
        run: |
          gh issue comment "$ISSUE" --body "Background agent finished:
          \`\`\`
          $(cat summary.txt 2>/dev/null || echo 'no summary - see the workflow log')
          \`\`\`
          Draft PRs from agents need a human review before merging."
